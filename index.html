<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Monitoring Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container mt-4">

    <!-- ALERTS -->
    <div id="alerts" class="mb-4"></div>

    <h1 class="mb-4">Network Monitoring Dashboard</h1>

    <!-- ADD / EDIT DEVICE -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Add / Edit Device</h5>

            <form id="deviceForm">
                <input type="hidden" id="editId">

                <div class="mb-3">
                    <label for="name" class="form-label">Device Name</label>
                    <input type="text" class="form-control" id="name" required>
                </div>

                <div class="mb-3">
                    <label for="host" class="form-label">IP / Hostname</label>
                    <input type="text" class="form-control" id="host" required>
                </div>

                <div class="mb-3">
                    <label for="port" class="form-label">Port</label>
                    <input type="number" id="port" class="form-control" value="80">
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="snmpEnabled">
                    <label class="form-check-label" for="snmpEnabled">
                        Enable SNMP
                    </label>
                </div>

                <div id="snmpFields" style="display:none;">
                    <div class="mb-3">
                        <label for="snmpCommunity" class="form-label">SNMP Community</label>
                        <input type="text" class="form-control" id="snmpCommunity" value="public">
                    </div>

                    <div class="mb-3">
                        <label for="snmpVersion" class="form-label">SNMP Version</label>
                        <select class="form-select" id="snmpVersion">
                            <option value="2c">2c</option>
                            <option value="1">1</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Save Device</button>
                <button type="button" class="btn btn-secondary" id="cancelEdit" style="display:none">
                    Cancel
                </button>
            </form>
        </div>
    </div>

    <!-- DOMAIN MONITORING -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Domain Monitoring</h5>

            <form id="domainForm" class="row g-2">
                <div class="col-md-8">
                    <label for="domainInput" class="form-label">Domain</label>
                    <input type="text" id="domainInput" class="form-control" placeholder="example.com" required>
                </div>
                <div class="col-md-4 d-flex align-items-end">
                    <button type="submit" class="btn btn-success w-100">Add Domain</button>
                </div>
            </form>

            <div id="domainMessage" class="mt-2"></div>
        </div>
    </div>

    <!-- DEVICES TABLE -->
    <table class="table table-striped" id="devicesTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Host</th>
                <th>Status</th>
                <th>Latency (ms)</th>
                <th>Last Seen</th>
                <th>Bandwidth (In / Out)</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

</div>

<!-- TRACEROUTE MODAL -->
<div class="modal fade" id="tracerouteModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Traceroute Results</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <pre id="tracerouteOutput" class="mb-0"></pre>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
