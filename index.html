<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Monitoring Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Network Monitoring Dashboard</h1>
        
        <!-- Add Device Form -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Add/Edit Device</h5>
                <form id="deviceForm">
                    <input type="hidden" id="editId" value="">
                    <div class="mb-3">
                        <label for="name" class="form-label">Device Name</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                     <div class="mb-2">
                        <label class="form-label">Port</label>
                         <input type="number" id="port" class="form-control" placeholder="e.g. 80, 443, 22" value="80" required>
                    </div>
                    <div class="mb-3">
                        <label for="host" class="form-label">IP/Hostname</label>
                        <input type="text" class="form-control" id="host" required>
                    </div>
  
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="snmpEnabled">
                        <label class="form-check-label" for="snmpEnabled">Enable SNMP</label>
                    </div>
                    <div id="snmpFields" style="display: none;">
                        <div class="mb-3">
                            <label for="snmpCommunity" class="form-label">SNMP Community String</label>
                            <input type="text" class="form-control" id="snmpCommunity" value="public">
                        </div>
                        <div class="mb-3">
                            <label for="snmpVersion" class="form-label">SNMP Version</label>
                            <select class="form-select" id="snmpVersion">
                                <option value="2c">2c</option>
                                <option value="1">1</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Device</button>
                    <button type="button" class="btn btn-secondary" id="cancelEdit">Cancel</button>
                </form>
            </div>
        </div>
        
        <!-- Devices Table -->
        <table class="table table-striped" id="devicesTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Host</th>
                    <th>Status</th>
                    <th>Latency (ms)</th>
                    <th>Last Seen</th>
                    <th>Bandwidth (In/Out)</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Traceroute Modal -->
    <div class="modal fade" id="tracerouteModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Traceroute Results</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <pre id="tracerouteOutput"></pre>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
